# How Daniel lives: his days, when he checks in on people, what he can do,
# what he may do without asking, and how he learns {owner}'s judgment. Times
# are in his time zone (timezone in life.yaml).

# He speaks first: reminders people asked for when they're due, and at the
# check-in times he considers asking someone about something going on in
# their life.
initiative:
  check_ins: ["11:00", "18:00"] # at most one check-in a day per person; [] turns them off
  quiet: 4h # only after the conversation has been quiet this long

# His own day, like a person's: in the morning he plans a few things from his
# goals, projects and routine; through the day he does them, for real, in
# writing; at night he writes his journal. What he makes is kept.
daily_life:
  enabled: true
  plan_at: "08:00"
  journal_at: "22:00"
  review_at: "Sun 20:00" # his weekly review: goals checked, new ones set, dreams revisited
  activities: 4          # things he plans a day, besides the journal
  budget_usd: 0.05       # most his own day may cost; past it, the rest is missed
  # What he can do beyond writing; his journal is always on. Remove one to
  # switch it off, or use [] for none.
  #   read_book     public-domain books from Project Gutenberg, a passage a day
  #   read_article  Wikipedia articles, to learn about a topic
  #   web_search    search the open web and read the best page
  #   read_page     read a page one of his own searches found
  abilities: [read_book, read_article, web_search, read_page]
  web: # how much of the open web he may use a day
    searches_per_day: 10
    pages_per_day: 15

# What he may do on his own. Each kind of action is auto (on his own), ask
# (he asks {owner} first, on Telegram, with Approve and Deny buttons) or forbid.
#   read_web          abilities that fetch from the web: auto or forbid
#   reach_out         messaging someone first (reminders, check-ins, deliveries)
#   commit            promising to make something for someone
#   publish           putting a work on his public page
#   dream             adding, rewording or dropping one of his dreams
#   spend, external_message   money, and email or posts outside the chat (later)
# {owner} can loosen or tighten most of these by telling him, on Telegram.
autonomy:
  classes:
    read_web: auto
    reach_out: ask
    commit: ask
    publish: ask
    dream: ask
    spend: forbid
    external_message: forbid
  ask_expires: 24h # unanswered, a request is denied

# He predicts what {owner} would choose on his own decisions (today's focus,
# starting something new, setting or dropping a goal) and asks on Telegram,
# to learn {owner}'s judgment. Goal calls always wait for an answer; day-plan
# calls he asks at most asks_per_day of, least sure first, and the rest
# {owner} can grade in the console. A different pick, and {owner}'s next
# message (within reply_window) is taken as why.
judgment:
  calls: true
  asks_per_day: 3
  reply_window: 30m
