name: release

# A tag like v0.3.0 builds minime for each system, attaches the binaries to a
# draft release (written and published by hand), and pushes the image to
# ghcr.io/grandbusta/minime as :v0.3.0. Publishing the release then moves
# :latest to it, so nothing reaches :latest before you've said it's ready.
# Everything every person shares is built into the binary, so it runs on its
# own with DATABASE_URL and MINIME_KEY.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} name="minime_${GITHUB_REF_NAME}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=.exe
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$name/minime$ext" ./cmd/minime
            cp LICENSE README.md "$name/"
            if [ "$os" = windows ]; then zip -qr "dist/$name.zip" "$name"; else tar -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/grandbusta/minime:${{ github.ref_name }}

  # The published release's image, both architectures, tagged :latest as it
  # is: nothing is rebuilt. A pre-release leaves :latest where it was.
  latest:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker buildx imagetools create -t ghcr.io/grandbusta/minime:latest "ghcr.io/grandbusta/minime:${{ github.event.release.tag_name }}"
