# ${VAR} references are filled in from the environment (see .env.example).

# Who the agent is: its name and life story, written by you.
self:
  life: self/life.yaml

database:
  url: ${DATABASE_URL}

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  # Only these Telegram user IDs are listened to. If empty, every message is
  # ignored and the sender's ID is logged, which is how you find yours.
  owner_ids: [${TELEGRAM_OWNER_ID}]
  poll_timeout_seconds: 30

# System 1: fast typed decisions. Switch providers by changing these lines.
decision:
  provider: openai # openai | typesafe (Jev, not implemented yet)
  model: gpt-6-luna # empty: the provider's default
  api_key: ${OPENAI_API_KEY}
  question_sets: decisions # directory of question set files

# System 2: slow reasoning and writing. Used when a reply needs words, or when
# System 1 is unsure. Switch providers by changing these lines.
reasoning:
  provider: openai # openai
  model: ${OPENAI_MODEL}
  api_key: ${OPENAI_API_KEY}
  prompt: prompts/reply.md # who the agent is and how it replies
  # How hard System 2 thinks before replying: none | low | medium | high. In a
  # timing test, low replied in 2.0–2.5s against 3.2–4.4s at the model's default
  # (medium), just as well; medium is also where the 12–29s spikes happened.
  effort: low

# Working memory: how much of the current conversation System 2 sees, so
# follow-ups like "Let's say Lagos" make sense.
working_memory:
  turns: 8    # earlier exchanges (message + reply); 0 turns recall off
  window: 30m # older exchanges are left out; 2h pulled finished topics into new ones

# Long-term memory: facts about the agent and the people it knows. Before each System 2
# reply, System 1 checks the newest facts for relevance (~170 input tokens,
# ~$0.00002 each with gpt-6-luna) and passes on the ones that help.
memory:
  recall_candidates: 30

# Initiative: the agent speaks first. A clock ticks once a minute; it sends
# the reminders people asked for when they're due, and at the check-in times
# it considers checking in on the people it talks with, about something going
# on in their lives that it hasn't asked about yet (open_threads question set).
initiative:
  timezone: Africa/Lagos # the agent's own: reminders and check-in times are in it
  check_ins: ["11:00", "18:00"] # at most one check-in a day per person; [] turns them off
  quiet: 4h # only after the conversation has been quiet this long

# Its own day, like a person's: in the morning it plans a few things from its
# interests, projects and routine (self/life.yaml); through the day it does
# them, for real, in writing (lyrics, beat ideas, notes); at night it writes a
# journal. What it makes is kept, and what it did becomes facts about itself.
# Times are in initiative.timezone.
daily_life:
  enabled: true
  # It can read public-domain books (Project Gutenberg, a passage at a time)
  # and Wikipedia articles; nothing else on the web.
  reading: true
  plan_at: "06:00"
  journal_at: "22:00"
  activities: 4      # things it plans a day, besides the journal
  budget_usd: 0.05   # most its own day may cost; past it, the rest is missed
  plan_prompt: prompts/plan.md
  activity_prompt: prompts/activity.md

# The owner's private mind console: its brain firing live, every decision and
# why, its memory, its day and what it made. Read-only. Never on the public
# profile's address. Anywhere but localhost it needs a token: open it once as
# http://<host>/?token=<CONSOLE_TOKEN> and the browser remembers it.
console:
  addr: 127.0.0.1:8090 # empty: no console
  token: ${CONSOLE_TOKEN}

# The agent's public profile page, like a person's own website: it writes it
# itself from its life story and the facts about itself it decides are fine to
# share (public_profile question set). Read-only: no way to contact it yet.
portfolio:
  addr: 127.0.0.1:8080 # where to serve it; on a server, e.g. :8080 behind a proxy. Empty: no page
  prompt: prompts/profile.md
  update_at: "00:00" # daily, UTC: it looks for new facts to share, rewriting the page only if they changed

# USD per 1M tokens, from OpenAI's pricing page (standard tier), used to record
# what each decision cost. cache_write is the 30-minute rate, the default TTL.
# A model missing here is recorded at $0. The Decisions API bills gpt-6-luna's
# input and cache rates; its output is free.
pricing:
  gpt-6-astra:   {input: 10.00, output: 50.00, cached_input: 1.00, cache_write: 12.50}
  gpt-6.1-sol:   {input: 2.00,  output: 10.00, cached_input: 0.10, cache_write: 2.50}
  gpt-6.1-terra: {input: 1.00,  output: 5.00,  cached_input: 0.05, cache_write: 1.25}
  gpt-6-luna:    {input: 0.10,  output: 0.50,  cached_input: 0.01, cache_write: 0.125}

log:
  level: info # debug | info | warn | error
